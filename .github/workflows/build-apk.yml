name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- Cache Unity Library ---
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # --- Generate keystore (auto) ---
      - name: Generate Android Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias infinityrpg \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=InfinityRPG,OU=Dev,O=InfinityRPG,L=SG,C=SG"
          echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 release.keystore)" >> $GITHUB_ENV

      # --- Build with GameCI ---
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.55f1
          buildMethod: InfinityRPG.Editor.BuildScript.BuildAndroid
          versioning: None
          androidAppBundle: false
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: android
          androidKeyaliasName: infinityrpg
          androidKeyaliasPass: android
          androidTargetSdkVersion: 34

      # --- Upload APK artifact ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityRPG-APK
          path: build/Android/*.apk
          retention-days: 30

      # --- Create Release (on tag push) ---
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Android/*.apk
          generate_release_notes: true
